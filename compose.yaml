services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-form_eskul}
      POSTGRES_USER: ${POSTGRES_USER:-form_eskul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-form_eskul_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: python migrate_empty.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-form_eskul}:${POSTGRES_PASSWORD:-form_eskul_local}@db:5432/${POSTGRES_DB:-form_eskul}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-form_eskul}:${POSTGRES_PASSWORD:-form_eskul_local}@db:5432/${POSTGRES_DB:-form_eskul}
      ADMIN_PIN: ${ADMIN_PIN:-112231}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-change-me}
      SESSION_HTTPS_ONLY: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
