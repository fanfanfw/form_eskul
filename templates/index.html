<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran Ekstrakurikuler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', path='/css/style.css') }}?v=4" rel="stylesheet">
</head>
<body>
    <header class="teacher-header">
        <nav class="container teacher-nav" aria-label="Navigasi utama">
            <a class="teacher-brand" href="/">
                <i class="fas fa-graduation-cap" aria-hidden="true"></i>
                <span>Form Eskul</span>
            </a>
            <a class="admin-link" href="/registrations">
                <i class="fas fa-list" aria-hidden="true"></i>
                <span>Data registrasi</span>
            </a>
        </nav>
    </header>

    <main class="teacher-main container">
        <section class="registration-card" aria-labelledby="formTitle">
            <div class="registration-heading">
                <p class="eyebrow">Pendaftaran siswa</p>
                <h1 id="formTitle">Pilih ekstrakurikuler</h1>
                <p>Selesaikan tiga langkah berikut.</p>
            </div>
            <div class="registration-body">
                <div id="alertContainer" aria-live="polite"></div>
                <form id="eskulForm" class="step-form">
                    <div class="form-step">
                        <span class="step-number" aria-hidden="true">1</span>
                        <div class="step-field">
                            <label for="kelasSelect" class="form-label">Kelas</label>
                            <select class="form-select form-select-lg" id="kelasSelect" required>
                                <option value="">Pilih kelas</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-step">
                        <span class="step-number" aria-hidden="true">2</span>
                        <div class="step-field">
                            <label for="siswaSelect" class="form-label">Siswa</label>
                            <select class="form-select form-select-lg" id="siswaSelect" required disabled>
                                <option value="">Pilih kelas terlebih dahulu</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-step">
                        <span class="step-number" aria-hidden="true">3</span>
                        <div class="step-field">
                            <label for="eskulSelect" class="form-label">Ekstrakurikuler</label>
                            <select class="form-select form-select-lg" id="eskulSelect" required disabled>
                                <option value="">Pilih siswa terlebih dahulu</option>
                            </select>
                        </div>
                    </div>
                    <div class="submit-area">
                        <button type="submit" class="btn btn-primary btn-lg" id="submitBtn" disabled>
                            <i class="fas fa-paper-plane me-2" aria-hidden="true"></i>Daftarkan siswa
                        </button>
                    </div>
                </form>
                <div id="loadingSpinner" class="loading-state" hidden>
                    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Memuat</span></div>
                    <p>Memproses data...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', path='/js/app.js') }}?v=4"></script>
</body>
</html>
